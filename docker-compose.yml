services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrinova
      POSTGRES_USER: agrinova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrinova -d agrinova"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend/agrinova-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://agrinova:${POSTGRES_PASSWORD}@db:5432/agrinova
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      GROQ_API_KEY: ${GROQ_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
